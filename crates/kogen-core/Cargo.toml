[package]
name = "kogen-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
jsonwebtoken = "9.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
socket2 = "0.5"
signal-hook = "0.3"
url = "2"
rustix = { version = "1.1.5", features = ["fs", "process"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
kogen-test-support = { path = "../kogen-test-support", optional = true }

[features]
hermetic-git-tests = ["dep:kogen-test-support"]

[dev-dependencies]
kogen-test-support = { path = "../kogen-test-support" }

[lints]
workspace = true
